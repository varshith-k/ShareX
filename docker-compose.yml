services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sharex
      POSTGRES_USER: sharex
      POSTGRES_PASSWORD: sharex
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/db/schema:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sharex -d sharex"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://sharex:sharex@postgres:5432/sharex?sslmode=disable
      JWT_SECRET: change-this-secret
      JWT_EXPIRY_HOURS: "24"
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      UPLOAD_DIR: /app/uploads
      MAX_UPLOAD_SIZE_MB: "10"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: http://localhost:8080
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres-data:
